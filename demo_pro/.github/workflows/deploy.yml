name: django demo build and deploy


on:
  push:
    branches:
      - master

env:
  IMAGE_NAME: demo_pro_1


jobs:
  build-deploy:
      runs-on: ubuntu-latest

      steps:
        - name: checkout source 
          uses: actions/checkout@v7

        - name: setup python
          uses: actions/setup-python@v7
          with:
              python-version: 'pypy3.12'
              cache: 'pip'
        - run: pip install -r requirements.txt

        - name: bulilding docker image 
          run : docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

        - name: login to docker hub
          uses: docker/login-action@v4
          with :
                 username: ${{ secrets.DOCKER_USERNAME }}
                 password: ${{ secrets.DOCKER_PASSWORD }}
          
        - name: push image to docker hub
          run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest 


        - name: login to EC2
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
              docker run -d -p 8000:8000 --name demo_pro_4 ${{ env.IMAGE_NAME }}:latest
              docker image prune -f



